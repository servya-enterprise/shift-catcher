services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${DB_NAME:-shift_catcher}
      POSTGRES_USER: ${DB_USER:-shift_catcher}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - shift-catcher-postgres:/var/lib/postgresql
    restart: unless-stopped

  app:
    image: ${IMAGE:?IMAGE must be set, e.g. ghcr.io/OWNER/shift-catcher:latest}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-shift_catcher}
      DB_USER: ${DB_USER:-shift_catcher}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN must be set}
      GREEN_API_API_URL: ${GREEN_API_API_URL:-}
      GREEN_API_INSTANCE_ID: ${GREEN_API_INSTANCE_ID:-}
      GREEN_API_API_TOKEN: ${GREEN_API_API_TOKEN:-}
      GREEN_API_WEBHOOK_TOKEN: ${GREEN_API_WEBHOOK_TOKEN:-}
      # Compose only passes what is listed here: a variable present in .env but absent from this
      # block never reaches the container.
      AUTO_CLAIM_ENABLED: ${AUTO_CLAIM_ENABLED:-false}
      CLAIM_WORKER_ENABLED: ${CLAIM_WORKER_ENABLED:-true}
      AUTO_EVALUATE_INTERVAL_MS: ${AUTO_EVALUATE_INTERVAL_MS:-1000}
      AUTO_CLAIM_INTERVAL_MS: ${AUTO_CLAIM_INTERVAL_MS:-1000}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-500}
      HEALTH_INTERVAL_MS: ${HEALTH_INTERVAL_MS:-60000}
      DETECTION_KNOWN_LOCATIONS: ${DETECTION_KNOWN_LOCATIONS:-}
      DETECTION_KNOWN_CITIES: ${DETECTION_KNOWN_CITIES:-}
      DETECTION_TIMEZONE: ${DETECTION_TIMEZONE:-America/Sao_Paulo}
      AI_PARSER_ENABLED: ${AI_PARSER_ENABLED:-false}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Authorization: Bearer '$${ADMIN_API_TOKEN} http://127.0.0.1:8080/api/v1/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  shift-catcher-postgres:
