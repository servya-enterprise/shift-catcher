name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check PyYAML==6.0.3
      - run: ./gradlew verify --no-daemon

  deploy:
    name: deploy
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          ssh-keygen -y -f ~/.ssh/vps_deploy_key > /dev/null
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<CFG
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/vps_deploy_key
            IdentitiesOnly yes
            BatchMode yes
            AddressFamily inet
            ConnectTimeout 10
            ServerAliveInterval 15
            ServerAliveCountMax 2
          CFG
          chmod 600 ~/.ssh/config

      - name: Preflight deploy host
        run: ssh vps "printf 'ssh ok on %s\n' \"\$(hostname)\""

      - name: Upload compose files to VPS
        run: |
          ssh vps "mkdir -p ~/shift-catcher"
          scp -F ~/.ssh/config docker-compose.prod.yml vps:~/shift-catcher/
          
      - name: Deploy on VPS
        run: |
          ssh vps '
            set -e
            cd ~/shift-catcher
            echo "IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}" > .image.env
            docker compose --env-file .env --env-file .image.env -f docker-compose.prod.yml pull
            docker compose --env-file .env --env-file .image.env -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
          '
