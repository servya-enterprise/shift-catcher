- id: WP-MVP-002
  title: Operator console
  status: DONE
  depends_on:
  - WP-MVP-001
  goal: >-
    Tela para uma operadora (12-MVP/MVP-Scope.md item 3), renderizada no servidor em /console.
    Deliberadamente sem endpoint novo: chama os mesmos serviços em processo, então o contrato de 42
    operações não muda. O token de administração fica no servidor; o navegador recebe apenas sessão.
  endpoints: []
  acceptance:
  - anonymous access redirects to sign-in
  - third-party text is escaped, never markup
  - state-changing posts need the session token
  - reload never re-claims a shift
- id: WP-MVP-003
  title: Generic calendar service & claimed shift write
  status: PLANNED
  depends_on:
  - WP-MVP-002
  goal: >-
    O lado de escrita de 12-MVP/Calendar-Integration.md, com a fronteira de
    09-Decisions/AUTODEC-0008-Clara-Care-Integration-Boundary.md. Pacote de calendario que nao
    importa este dominio, verificado por teste de arquitetura; plantao pego vira evento com
    extendedProperties.private carregando chave de correlacao e marcador de origem; segundo tipo de
    evento no outbox por migration. Falha de calendario nunca derruba o claim, e os dois nunca sao
    uma transacao so. Nenhum endpoint novo: qualquer operacao HTTP que este pacote precise entra com
    catalogo, OpenAPI, cobertura e checksums no mesmo commit.
  endpoints: []
  acceptance:
  - calendar package imports nothing from this domain
  - retried outbox event creates no second calendar entry
  - failed calendar write leaves the claim intact
  - retraction removes the event, and a refused removal survives being reported
- id: WP-MVP-004
  title: Calendar as a commitment source
  status: PLANNED
  depends_on:
  - WP-MVP-003
  goal: >-
    O lado de leitura: terceiro bean de CommitmentSourcePort, sem tocar em rules nem em
    AvailabilityService. Le free/busy, nunca events, e espelha janelas em vez de palavras -
    AUTODEC-0008 decisoes 2 e 3, que existem para impedir que appointment clinico do Clara Care
    entre neste banco. Sync incremental, watch channel e ciclo de vida da credencial (consent,
    refresh, revoke) com sinal explicito de conexao quebrada visivel no console. Nunca no caminho
    sincrono de avaliacao. Nenhum endpoint novo pelas mesmas razoes do WP-MVP-003.
  endpoints: []
  acceptance:
  - evaluation path performs no network call
  - mirror schema has no column able to hold an event title
  - events this system wrote are ignored as commitments
  - a broken connection is visible rather than silently empty
- id: WP-MVP-005
  title: Angular operator module
  status: PLANNED
  depends_on:
  - WP-MVP-002
  goal: >-
    Substituir a tela Thymeleaf de WP-MVP-002 por um modulo Angular com identidade visual propria,
    alcancado como item do menu do Clara Care segundo
    09-Decisions/AUTODEC-0009-Frontend-Embedding-Boundary.md: link, nao iframe nem modulo federado.
    O navegador fala com uma porta JSON em /console/api/*, que reusa a sessao do console e chama os
    mesmos servicos em processo, entao nenhuma operacao entra em /api/v1 e o contrato continua em 42.
    Nenhum dado novo de dominio: 12-MVP/Frontend-Angular.md mapeia cada elemento de tela a um campo
    que ja existe ou e derivavel. O token de administracao nunca chega ao navegador. /console
    continua servindo ate as rotas novas passarem nos gates, e so entao vira redirect.
  endpoints: []
  acceptance:
  - a hostile group message renders as text, never as markup
  - a blank field in the correction form keeps the value already read
  - a double click on Pegar produces one claim
  - a stale version repaints from the server instead of retrying
  - an unauthenticated request under /console/api returns 401 rather than a redirect
