spring:
  application:
    name: shift-catcher
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shift_catcher}
    username: ${DB_USER:shift_catcher}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    validate-migration-naming: true
  jackson:
    time-zone: UTC

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs

shift-catcher:
  security:
    admin-api-token: ${ADMIN_API_TOKEN:}
  poc:
    stage: TRANSPORT
  green-api:
    api-url: ${GREEN_API_API_URL:}
    instance-id: ${GREEN_API_INSTANCE_ID:}
    api-token: ${GREEN_API_API_TOKEN:}
    webhook-token: ${GREEN_API_WEBHOOK_TOKEN:}
    connect-timeout: ${GREEN_API_CONNECT_TIMEOUT:2s}
    read-timeout: ${GREEN_API_READ_TIMEOUT:5s}
    allow-insecure-http: ${GREEN_API_ALLOW_INSECURE_HTTP:false}
