spring:
  application:
    name: shift-catcher
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shift_catcher}
    username: ${DB_USER:shift_catcher}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    validate-migration-naming: true
  jackson:
    time-zone: UTC

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs

shift-catcher:
  security:
    admin-api-token: ${ADMIN_API_TOKEN:}
  poc:
    stage: RELIABILITY
  detection:
    # Feeds both the fast filter and the deterministic extractor; empty means "no known place",
    # which only costs a signal, never a wrong location.
    known-locations: ${DETECTION_KNOWN_LOCATIONS:}
    known-cities: ${DETECTION_KNOWN_CITIES:}
    timezone: ${DETECTION_TIMEZONE:America/Sao_Paulo}
  ai:
    # Stage 3 of the pipeline: consulted only for a candidate the deterministic parser left
    # ambiguous, and never inside the webhook request.
    enabled: ${AI_PARSER_ENABLED:false}
    base-url: ${AI_BASE_URL:}
    model: ${AI_MODEL:qwen2.5:3b}
    timeout: ${AI_TIMEOUT:30s}
  claim:
    # The automatic path needs this AND the active rule set AND the group flag. Default is off.
    auto-claim-enabled: ${AUTO_CLAIM_ENABLED:false}
    worker-enabled: ${CLAIM_WORKER_ENABLED:true}
    # Reaction speed is the product: these three polls are what stands between a message arriving
    # and PEGO leaving, so they are deliberately tight. Each is one small indexed query.
    auto-evaluate-interval-ms: ${AUTO_EVALUATE_INTERVAL_MS:1000}
    auto-claim-interval-ms: ${AUTO_CLAIM_INTERVAL_MS:1000}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
    health-interval-ms: ${HEALTH_INTERVAL_MS:60000}
  green-api:
    api-url: ${GREEN_API_API_URL:}
    instance-id: ${GREEN_API_INSTANCE_ID:}
    api-token: ${GREEN_API_API_TOKEN:}
    webhook-token: ${GREEN_API_WEBHOOK_TOKEN:}
    connect-timeout: ${GREEN_API_CONNECT_TIMEOUT:2s}
    read-timeout: ${GREEN_API_READ_TIMEOUT:5s}
    allow-insecure-http: ${GREEN_API_ALLOW_INSECURE_HTTP:false}
