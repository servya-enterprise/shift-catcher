components:
  headers:
    CorrelationId:
      description: Correlation identifier propagated or generated by the service.
      schema:
        type: string
  securitySchemes:
    WebhookBearer:
      type: http
      scheme: bearer
    AdminBearer:
      type: http
      scheme: bearer
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - correlationId
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        correlationId:
          type: string
        instance:
          type: string
    HealthResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - database
      - timestamp
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        database:
          type: string
          enum: [UP, DOWN]
        timestamp:
          type: string
          format: date-time
    PocStatusResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - stage
      - currentWorkPackage
      - greenApiTransport
      - timestamp
      properties:
        status:
          type: string
        stage:
          type: string
        currentWorkPackage:
          type: string
        greenApiTransport:
          type: string
          enum: [NOT_VERIFIED, GO, NO_GO]
        timestamp:
          type: string
          format: date-time
    GreenApiWebhookEnvelope:
      type: object
      additionalProperties: true
      properties:
        typeWebhook:
          type: string
        instanceData:
          $ref: '#/components/schemas/GreenApiInstanceData'
        timestamp:
          type: integer
          format: int64
        idMessage:
          type: string
        senderData:
          $ref: '#/components/schemas/GreenApiSenderData'
        messageData:
          $ref: '#/components/schemas/GreenApiMessageData'
    GreenApiInstanceData:
      type: object
      additionalProperties: true
      properties:
        idInstance:
          type: integer
          format: int64
    GreenApiSenderData:
      type: object
      additionalProperties: true
      properties:
        chatId:
          type: string
        chatName:
          type: string
        sender:
          type: string
        senderName:
          type: string
        senderContactName:
          type: string
    GreenApiMessageData:
      type: object
      additionalProperties: true
      properties:
        typeMessage:
          type: string
        textMessageData:
          type: object
          additionalProperties: true
          properties:
            textMessage:
              type: string
    WebhookIngestionResponse:
      type: object
      additionalProperties: false
      required: [status, receivedAt]
      properties:
        status:
          type: string
          enum: [ACCEPTED, DUPLICATE, IGNORED]
        eventId:
          type: [string, 'null']
          format: uuid
        receivedAt:
          type: string
          format: date-time
        persistedAt:
          type: [string, 'null']
          format: date-time
    GreenApiStateResponse:
      type: object
      additionalProperties: false
      required: [configured, state, operational, observedAt]
      properties:
        configured:
          type: boolean
        state:
          type: string
          enum: [UNCONFIGURED, AUTHORIZED, STARTING, SLEEP_MODE, NOT_AUTHORIZED, BLOCKED, SUSPENDED, UNKNOWN]
        rawState:
          type: [string, 'null']
        operational:
          type: boolean
        observedAt:
          type: string
          format: date-time
    LatestGroupWebhookResponse:
      type: object
      additionalProperties: false
      required: [eventId, chatId, senderId, providerMessageId, providerTimestamp, webhookReceivedAt, persistedAt]
      properties:
        eventId:
          type: string
          format: uuid
        chatId:
          type: string
        senderId:
          type: string
        providerMessageId:
          type: string
        providerTimestamp:
          type: string
          format: date-time
        webhookReceivedAt:
          type: string
          format: date-time
        persistedAt:
          type: string
          format: date-time
    GreenApiVerificationResponse:
      type: object
      additionalProperties: false
      required: [configured, providerState, providerOperational, correctIdentifiersObserved, readyForTestReply, quotedReplyVisualStatus, verified, checkedAt]
      properties:
        configured:
          type: boolean
        providerState:
          type: string
        providerOperational:
          type: boolean
        latestGroupWebhook:
          oneOf:
          - $ref: '#/components/schemas/LatestGroupWebhookResponse'
          - type: 'null'
        correctIdentifiersObserved:
          type: boolean
        readyForTestReply:
          type: boolean
        quotedReplyVisualStatus:
          type: string
          enum: [NOT_CONFIRMED, CONFIRMED, FAILED]
        verified:
          type: boolean
        checkedAt:
          type: string
          format: date-time
    SendTestReplyRequest:
      type: object
      additionalProperties: false
      required: [chatId, quotedMessageId]
      properties:
        chatId:
          type: string
          pattern: '@g\\.us$'
        quotedMessageId:
          type: string
          minLength: 1
          maxLength: 128
    SendTestReplyResponse:
      type: object
      additionalProperties: false
      required: [replyId, status, chatId, quotedMessageId, message, idempotentReplay, visualConfirmationRequired]
      properties:
        replyId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, ACCEPTED, FAILED]
        providerMessageId:
          type: [string, 'null']
        chatId:
          type: string
        quotedMessageId:
          type: string
        message:
          type: string
          const: PEGO
        sendStartedAt:
          type: [string, 'null']
          format: date-time
        providerAcceptedAt:
          type: [string, 'null']
          format: date-time
        idempotentReplay:
          type: boolean
        visualConfirmationRequired:
          type: boolean
    GenericObject:
      type: object
      additionalProperties: true
