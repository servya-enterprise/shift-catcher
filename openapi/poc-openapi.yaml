components:
  headers:
    CorrelationId:
      description: Correlation identifier propagated or generated by the service.
      schema:
        type: string
  securitySchemes:
    WebhookBearer:
      type: http
      scheme: bearer
    AdminBearer:
      type: http
      scheme: bearer
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - correlationId
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        correlationId:
          type: string
        instance:
          type: string
    HealthResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - database
      - timestamp
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        database:
          type: string
          enum: [UP, DOWN]
        timestamp:
          type: string
          format: date-time
    PocStatusResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - stage
      - currentWorkPackage
      - greenApiTransport
      - timestamp
      properties:
        status:
          type: string
        stage:
          type: string
        currentWorkPackage:
          type: string
        greenApiTransport:
          type: string
          enum: [NOT_VERIFIED, GO, NO_GO]
        timestamp:
          type: string
          format: date-time
    GreenApiWebhookEnvelope:
      type: object
      additionalProperties: true
      properties:
        typeWebhook:
          type: string
        instanceData:
          $ref: '#/components/schemas/GreenApiInstanceData'
        timestamp:
          type: integer
          format: int64
        idMessage:
          type: string
        senderData:
          $ref: '#/components/schemas/GreenApiSenderData'
        messageData:
          $ref: '#/components/schemas/GreenApiMessageData'
    GreenApiInstanceData:
      type: object
      additionalProperties: true
      properties:
        idInstance:
          type: integer
          format: int64
    GreenApiSenderData:
      type: object
      additionalProperties: true
      properties:
        chatId:
          type: string
        chatName:
          type: string
        sender:
          type: string
        senderName:
          type: string
        senderContactName:
          type: string
    GreenApiMessageData:
      type: object
      additionalProperties: true
      properties:
        typeMessage:
          type: string
        textMessageData:
          type: object
          additionalProperties: true
          properties:
            textMessage:
              type: string
    WebhookIngestionResponse:
      type: object
      additionalProperties: false
      required: [status, receivedAt]
      properties:
        status:
          type: string
          enum: [ACCEPTED, DUPLICATE, IGNORED]
        eventId:
          type: [string, 'null']
          format: uuid
        receivedAt:
          type: string
          format: date-time
        persistedAt:
          type: [string, 'null']
          format: date-time
    GreenApiStateResponse:
      type: object
      additionalProperties: false
      required: [configured, state, operational, observedAt]
      properties:
        configured:
          type: boolean
        state:
          type: string
          enum: [UNCONFIGURED, AUTHORIZED, STARTING, SLEEP_MODE, NOT_AUTHORIZED, BLOCKED, SUSPENDED, UNKNOWN]
        rawState:
          type: [string, 'null']
        operational:
          type: boolean
        observedAt:
          type: string
          format: date-time
    LatestGroupWebhookResponse:
      type: object
      additionalProperties: false
      required: [eventId, chatId, senderId, providerMessageId, messageText, providerTimestamp, webhookReceivedAt, persistedAt]
      properties:
        eventId:
          type: string
          format: uuid
        chatId:
          type: string
        senderId:
          type: string
        providerMessageId:
          type: string
        messageText:
          type: string
        providerTimestamp:
          type: string
          format: date-time
        webhookReceivedAt:
          type: string
          format: date-time
        persistedAt:
          type: string
          format: date-time
    GreenApiVerificationResponse:
      type: object
      additionalProperties: false
      required: [configured, providerState, providerOperational, correctIdentifiersObserved, readyForTestReply, quotedReplyVisualStatus, verified, checkedAt]
      properties:
        configured:
          type: boolean
        providerState:
          type: string
        providerOperational:
          type: boolean
        latestGroupWebhook:
          oneOf:
          - $ref: '#/components/schemas/LatestGroupWebhookResponse'
          - type: 'null'
        correctIdentifiersObserved:
          type: boolean
        readyForTestReply:
          type: boolean
        quotedReplyVisualStatus:
          type: string
          enum: [NOT_CONFIRMED, CONFIRMED, FAILED]
        verified:
          type: boolean
        checkedAt:
          type: string
          format: date-time
    SendTestReplyRequest:
      type: object
      additionalProperties: false
      required: [chatId, quotedMessageId]
      properties:
        chatId:
          type: string
          pattern: '@g\\.us$'
        quotedMessageId:
          type: string
          minLength: 1
          maxLength: 128
    SendTestReplyResponse:
      type: object
      additionalProperties: false
      required: [replyId, status, chatId, quotedMessageId, message, idempotentReplay, visualConfirmationRequired]
      properties:
        replyId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, ACCEPTED, FAILED]
        providerMessageId:
          type: [string, 'null']
        chatId:
          type: string
        quotedMessageId:
          type: string
        message:
          type: string
          const: PEGO
        sendStartedAt:
          type: [string, 'null']
          format: date-time
        providerAcceptedAt:
          type: [string, 'null']
          format: date-time
        idempotentReplay:
          type: boolean
        visualConfirmationRequired:
          type: boolean
    ClaimMessageRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          description: Single line. The default is PEGO, the wording the POC froze.
          type: string
          minLength: 1
          maxLength: 512
        version:
          description: Supply it to be told about a concurrent change instead of overwriting one.
          type: integer
    ClaimMessageResponse:
      type: object
      additionalProperties: false
      required: [message, version, updatedAt]
      properties:
        message:
          type: string
        version:
          type: integer
        updatedAt:
          type: string
          format: date-time
    CreateAvailabilityRequest:
      type: object
      additionalProperties: false
      required: [shiftDate]
      properties:
        shiftDate:
          type: string
          format: date
        startTime:
          description: Supply both times or neither; half a window cannot be compared.
          type: string
        endTime:
          type: string
        endsNextDay:
          type: boolean
        label:
          type: string
          maxLength: 128
        note:
          type: string
    AvailabilityEntryResponse:
      type: object
      additionalProperties: false
      required: [id, shiftDate, endsNextDay, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        shiftDate:
          type: string
          format: date
        startTime:
          type: string
          nullable: true
        endTime:
          type: string
          nullable: true
        endsNextDay:
          type: boolean
        label:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Commitment:
      description: >-
        Something the operator is already committed to. MANUAL entries are hers to edit; CLAIM
        entries are read from the claim itself, so retracting a claim removes the commitment.
      type: object
      additionalProperties: false
      required: [source, shiftDate, endsNextDay]
      properties:
        source:
          type: string
          enum: [MANUAL, CLAIM]
        reference:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
        shiftDate:
          type: string
          format: date
        startTime:
          type: string
          nullable: true
        endTime:
          type: string
          nullable: true
        endsNextDay:
          type: boolean
    CommitmentListResponse:
      type: object
      additionalProperties: false
      required: [from, to, commitments, count]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        commitments:
          type: array
          items:
            $ref: '#/components/schemas/Commitment'
        count:
          type: integer
    GenericObject:
      type: object
      additionalProperties: true
