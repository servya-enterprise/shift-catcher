components:
  headers:
    CorrelationId:
      description: Correlation identifier propagated or generated by the service.
      schema:
        type: string
  securitySchemes:
    WebhookBearer:
      type: http
      scheme: bearer
    AdminBearer:
      type: http
      scheme: bearer
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - correlationId
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        correlationId:
          type: string
        instance:
          type: string
    HealthResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - database
      - timestamp
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        database:
          type: string
          enum: [UP, DOWN]
        timestamp:
          type: string
          format: date-time
    PocStatusResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - stage
      - currentWorkPackage
      - greenApiTransport
      - timestamp
      properties:
        status:
          type: string
        stage:
          type: string
        currentWorkPackage:
          type: string
        greenApiTransport:
          type: string
          enum: [NOT_VERIFIED, GO, NO_GO]
        timestamp:
          type: string
          format: date-time
    GenericObject:
      type: object
      additionalProperties: true
